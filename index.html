body{background:#EFEDE6;color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Segoe UI","Microsoft YaHei",sans-serif;line-height:1.75;display:flex;justify-content:center;padding:18px 14px calc(40px + env(safe-area-inset-bottom));min-height:100vh}

.book{width:100%;max-width:430px;display:flex;flex-direction:column}
.pager{display:flex;justify-content:space-between;align-items:center;font-size:11px;color:var(--soft);letter-spacing:.15em;margin-bottom:10px}

.cover .dk{position:absolute;top:14px;left:14px;background:var(--red);color:#fff;font-size:9px;font-weight:800;padding:2px 5px;letter-spacing:.05em;border-radius:2px}
.cover .topline{font-size:9px;letter-spacing:.35em;opacity:.85;margin-top:14px;text-align:center}
.cover .seal{width:38%;aspect-ratio:1;border:1.5px solid rgba(255,255,255,.9);border-radius:50%;margin:auto 0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px}
.cover .seal .tree{font-size:26px;line-height:1}
.cover .seal .en{font-size:7px;letter-spacing:.22em;opacity:.9}
.cover .seal .dot{width:4px;height:4px;border-radius:50%;background:rgba(255,255,255,.9)}
.cover .btitle{font-size:26px;font-weight:800;letter-spacing:.14em;text-align:center}
.cover .btitle small{display:block;font-size:10px;font-weight:400;letter-spacing:.3em;opacity:.85;margin-top:6px}
.cover .thumbs{display:flex;gap:6px;width:100%;margin-top:auto}
.cover .thumbs span{flex:1;aspect-ratio:1;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.35);display:flex;align-items:center;justify-content:center;font-size:17px}
.cover .hint{position:absolute;bottom:-26px;left:0;right:0;text-align:center;font-size:10px;color:var(--soft);letter-spacing:.2em}
/* ── 内页通用 ── */
.inner{padding:26px 24px 30px;display:flex;flex-direction:column;min-height:100%}
.ph{display:flex;justify-content:space-between;align-items:baseline;border-bottom:2px solid var(--cobalt);padding-bottom:8px;margin-bottom:14px}
.ph h2{font-size:17px;font-weight:800;letter-spacing:.06em}
.ph .pg{font-size:11px;color:var(--soft)}
.note-list{list-style:none}
.note-list li{display:flex;gap:10px;padding:9px 0;border-bottom:1px solid var(--line);font-size:13px}
.note-list .k{color:var(--cobalt);font-size:11px;letter-spacing:.1em;width:74px;flex-shrink:0;padding-top:2px}
.note-list .v{flex:1}
.v b{font-weight:700}
.v .mono{color:var(--soft);font-size:11px}
blockquote{border-left:2px solid var(--cobalt);padding:4px 0 4px 12px;margin:12px 0;font-size:12.5px;color:var(--soft);font-style:italic}
.fine{font-size:10px;color:var(--soft);margin-top:auto;padding-top:14px;border-top:1px solid var(--line);letter-spacing:.04em}

.herb-latin{font-size:12px;color:var(--soft);font-style:italic;margin:2px 0 14px}
.herb-desc{font-size:14px;margin-bottom:14px}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:14px}
.tags span{font-size:10.5px;letter-spacing:.08em;border:1px solid var(--cobalt);color:var(--cobalt);border-radius:99px;padding:2px 10px}
.tip{background:#F4F3EC;border-radius:6px;padding:10px 12px;font-size:12.5px;margin-bottom:12px}
.tip b{color:var(--cobalt)}
.herb-foot{display:flex;justify-content:space-between;align-items:center;margin-top:auto;padding-top:12px;border-top:1px solid var(--line)}
.read-mark{font-size:10px;letter-spacing:.2em;color:var(--soft)}
.read-mark.on{color:var(--cobalt);font-weight:700}

.nav{display:flex;gap:10px;margin-top:16px}
.nav button{flex:1;border:1.5px solid var(--ink);background:var(--ink);color:#fff;font-size:13px;font-weight:700;padding:12px 0;border-radius:99px;letter-spacing:.12em;cursor:pointer}
.nav button.ghost{background:transparent;color:var(--ink)}
.nav button:disabled{opacity:.28;cursor:default}
.pageno{text-align:center;font-size:11px;color:var(--soft);margin-top:10px;letter-spacing:.3em;font-variant-numeric:tabular-nums}

.toc-list .no{font-size:11px;color:var(--soft);width:26px;font-variant-numeric:tabular-nums}
.toc-list .nm{flex:1;font-weight:600}
.toc-list .en{font-size:11px;color:var(--soft);font-style:italic}
.toc-list .rd{width:7px;height:7px;border-radius:50%;background:#DDDCE3;flex-shrink:0}
.toc-list li.read .rd{background:var(--cobalt)}
.toc-list li.read .nm{color:var(--soft)}
.toast{position:fixed;left:50%;bottom:34px;transform:translateX(-50%) translateY(16px);background:var(--cobalt);color:#fff;font-size:12.5px;padding:8px 18px;border-radius:99px;opacity:0;pointer-events:none;transition:all .3s;z-index:60;letter-spacing:.05em}

/* ── 目录页章节树 ── */
.toc-list li.sec{border-bottom:1.5px solid #C9C6B8;padding:11px 2px 8px}
.toc-list li.sub{padding:6px 2px;border-bottom:none;font-size:12.5px;cursor:default}
.toc-list li.sub .en{min-width:28px;text-align:right}
/* ── 打卡册 ── */
.herb-roll{flex:1;max-height:520px;overflow-y:auto;-webkit-overflow-scrolling:touch}
.roll-item{display:flex;align-items:center;gap:8px;padding:7px 4px;border-bottom:1px solid var(--line);cursor:pointer;font-size:13px}
.roll-item .no{font-size:10px;color:var(--soft);width:30px;flex-shrink:0}
.roll-item .nm{flex:1;font-weight:600}
.roll-item.on .nm{color:var(--cobalt)}
.roll-item .pgn{font-size:10px;color:var(--soft)}
.roll-item .dot{width:10px;height:10px;border-radius:50%;background:#DDDCE3;flex-shrink:0;transition:all .2s}
.roll-item.on .dot{background:var(--cobalt);box-shadow:0 0 0 3px rgba(33,53,142,.14)}

</style>
</head>

    HERBS.forEach(function(hb,i){
      var on=isMarked(i);
      h+='<div class="roll-item'+(on?" on":"")+'" data-i="'+i+'"><span class="no mono">'+String(i+1).padStart(3,"0")+'</span><span class="nm">'+esc(hb[0])+'</span><span class="pgn mono">p.'+hb[1]+'</span><span class="dot"></span></div>';
    });
    h+='</div><div class="fine">点行点亮圆点 · 对照实体书逐条打卡 · 再点取消</div></div>';
  }else if(cur<=11){
    var f=FEATURE[cur-4];
    h='<div class="inner"><div class="ph"><h2>香草 · '+esc(f.zh)+'</h2><span class="pg mono">'+String(cur-1).padStart(2,"0")+'</span></div>'+
      '<div class="herb-name">'+esc(f.zh)+'</div><div class="herb-latin">'+esc(f.en)+(f.latin?" · "+esc(f.latin):"")+' · 原书 p.'+f.pg+'</div>'+
      '<p class="herb-desc">'+esc(f.d)+'</p><div class="tags">'+f.t.map(function(t){return "<span>"+esc(t)+"</span>"}).join("")+'</div>'+
      '<div class="tip"><b>种植手记</b> · '+esc(f.tip)+'</div>'+
      '<div class="herb-foot"><span class="read-mark '+(isRead(cur)?"on":"")+'" id="mark">'+(isRead(cur)?"● 已翻过":"○ 尚未翻过")+'</span><span class="pg mono">'+(cur-3)+' / '+FEATURE.length+'</span></div>'+
      '<div class="fine">香草页仅供生活参考 · 不构成医疗建议</div></div>';
  }else if(cur===12){
    h='<div class="inner"><div class="ph"><h2>书中配方 · 花草茶</h2><span class="pg mono">12</span></div>'+
      '<blockquote style="border-color:var(--gold)">引自原书第 175 页 · 豆瓣「原文摘录」· 目录「花草茶」章 p.175</blockquote>'+
      '<div class="herb-name" style="font-size:18px">柠檬香蜂草 &amp; 玫瑰茶</div>'+
      '<p class="herb-desc">这种草本茶由能令人放松的柠檬香蜂草与能愉悦心情的玫瑰花制作而成，融合后能释放出属于夏季的清新气息，趁热饮用或冷却后饮用均可。用新鲜的柠檬香蜂草叶片和大马士革玫瑰花瓣制作口感最好。</p>'+
      '<div class="tip"><b>要点</b> · 香蜂草两三枝嫩叶，玫瑰花瓣五六片，热水冲浸约五分钟。热饮偏苦，冷萃更清甜。</div>'+
      '<div class="fine">配方引自豆瓣「原文摘录」· 仅供参考</div></div>';
  }else{
    var mc2=markedCount();
    h='<div class="inner"><div class="ph"><h2>翻完了</h2><span class="pg mono">13</span></div>'+
      '<p class="herb-desc" style="margin-top:8px">打卡册 '+mc2+' / 100 种点亮，精选导读 '+(function(){var n=0;for(var k in READ){if(READ[k])n++}return n})()+' / '+FEATURE.length+' 篇翻过。下次从书里挑一株没见过的香草，翻到它那一页。</p>'+
      '<blockquote>每一株香草，都是可以端上桌的风景。</blockquote>'+
      '<div class="fine">《'+META.title+'》 · '+META.press+' · 线上翻页手账<br>目录数据来自实体书 · 生活内容不构成医疗建议</div></div>';
  }
  pg.innerHTML=h;
  $("prevBtn").disabled=cur===0;
  $("nextBtn").textContent=cur===N-1?"回封面 ↻":"下一页 ›";
  $("pageno").textContent=cur===0?"— 封面 —":(cur+1)+" / "+N;
  var go=$("coverGo");
  if(go)go.addEventListener("click",function(){cur=1;render()});
  pg.querySelectorAll(".toc-list li").forEach(function(li){
    if(li.getAttribute("data-p"))li.addEventListener("click",function(){cur=parseInt(li.getAttribute("data-p"),10);render();window.scrollTo(0,0)});
  });
  pg.querySelectorAll(".roll-item").forEach(function(row){
    row.addEventListener("click",function(){toggleMark(parseInt(row.getAttribute("data-i"),10));render()});
  });
  var bar=pg.querySelector(".bar");
  if(cur>=4&&cur<=11&&!isRead(cur)){markRead(cur)}
}
$("prevBtn").addEventListener("click",function(){if(cur>0){cur--;render();window.scrollTo(0,0)}});
$("nextBtn").addEventListener("click",function(){cur=cur===N-1?0:cur+1;render();window.scrollTo(0,0)});
var now=new Date();
$("dateStr").textContent=(now.getMonth()+1)+"."+now.getDate();
render();

})();
</script>
</body>
</html>
